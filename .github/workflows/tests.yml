name: Tests
on:
  push:
    branches-ignore: [codex/windows-offline-mvp]
  pull_request:
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.8'
      - run: uv sync --frozen --python 3.11
      - run: uv pip check
      - run: uv run --frozen python -m pytest -q
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
      - run: uv run --frozen python scripts/package_release.py
