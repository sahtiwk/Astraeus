[project]
name = "astraeus-local"
version = "0.3.0rc1"
description = "Offline-first log investigation with local evidence-linked diagnosis"
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit==1.52.2", "pydantic==2.12.5", "requests==2.32.5",
  "chromadb==1.5.9", "sentence-transformers==5.2.0", "psutil==7.2.1",
  "torch==2.9.1", "transformers==4.57.3",
]

[dependency-groups]
dev = ["pytest==9.0.3"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
