name: Public demo container
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.demo -t astraeus-demo .
      - run: |
          docker run -d --name astraeus-demo -e PORT=10001 -p 127.0.0.1:10001:10001 astraeus-demo
          curl --fail --retry 20 --retry-all-errors --max-time 5 http://127.0.0.1:10001/_stcore/health
          docker exec -i astraeus-demo python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("demo.py").run()
          for sample in app.selectbox[0].options:
              app.selectbox[0].select(sample).run()
              app.button[0].click().run()
              assert not app.exception
              assert len(app.code) == 1
              assert not app.get("file_uploader")
          PY
      - if: always()
        run: docker logs astraeus-demo
